{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Change Password</h1>
    <p class="auth-description">
        We will email a six-digit verification code to
        <strong>{{ user.email }}</strong> before allowing a password change.
    </p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn">Send Email OTP</button>
    </form>
    <p class="auth-help-link">
        <a href="{% url 'accounts:profile' %}">Back to profile</a>
    </p>
</div>
{% endblock %}
