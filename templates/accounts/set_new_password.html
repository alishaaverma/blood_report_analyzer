{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Set New Password</h1>
    <p class="auth-description">
        Choose a strong password that you do not use on another account.
    </p>
    <form method="post" id="setPasswordApiForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">
            {% if purpose == "change" %}Change Password{% else %}Reset Password{% endif %}
        </button>
    </form>
    <p id="passwordApiStatus" class="api-status" role="status" aria-live="polite"></p>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('setPasswordApiForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const button = this.querySelector('button[type="submit"]');
    const status = document.getElementById('passwordApiStatus');
    button.disabled = true;
    status.className = 'api-status';
    status.textContent = 'Updating password...';

    fetch("{% url 'accounts:api_set_new_password' %}", {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': this.querySelector('[name="csrfmiddlewaretoken"]').value
        },
        body: JSON.stringify({
            purpose: "{{ purpose|escapejs }}",
            new_password1: this.querySelector('[name="new_password1"]').value,
            new_password2: this.querySelector('[name="new_password2"]').value
        })
    }).then(response => response.json().then(data => ({ok: response.ok, data})))
      .then(result => {
          if (!result.ok) throw new Error(result.data.error);
          status.className = 'api-status api-success';
          status.textContent = result.data.message;
          window.location.href = result.data.next_url;
      }).catch(error => {
          status.className = 'api-status api-error';
          status.textContent = error.message || 'Could not update password.';
          button.disabled = false;
      });
});
</script>
{% endblock %}
